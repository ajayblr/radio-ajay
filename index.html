<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var s = localStorage.getItem('theme');
        var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!dark) document.documentElement.classList.add('light');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Inter as one variable-font file, fetched in parallel with the JS instead of
         after the CSS (it used to be an @import inside index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />

    <!-- Warm up the connection to the primary radio-browser API mirror used on first load -->
    <link rel="preconnect" href="https://de1.api.radio-browser.info" crossorigin />
    <link rel="dns-prefetch" href="https://de1.api.radio-browser.info" />

    <!-- Responsive + car display friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / installable — opens in standalone (full-window) mode when added to home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RadioAjay" />
    <meta name="application-name" content="RadioAjay" />
    <meta name="theme-color" content="#121212" />

    <!-- Media session API hint for car players -->
    <meta name="media-playback" content="audio" />

    <title>RadioAjay — Internet Radio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
